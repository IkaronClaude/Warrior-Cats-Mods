; WaCa ModKit roster - an example (every value commented out). Copy it, fill it in, and list it in config/roster.ini.
;
; A section is one cat:
;   [Narrative.<story role>]      a story cat, e.g. [Narrative.ThunderClanDeputy], [Narrative.TheAgingLeader]
;                                 (all story roles: Scripts/wacaroles.lua, ENarrativeRole)
;   [<Clan>.<Rank>]               the first generated cat of that rank in that clan, e.g. [ThunderClan.Leader]
;   [<Clan>.<Rank>.<n>]           the n-th one, e.g. [RiverClan.Warrior.3]
;   Clans: ThunderClan, ShadowClan, RiverClan, WindClan. Ranks: Kit, Apprentice, Warrior, Elder, MedicineCat, Queen,
;   Deputy, Leader, StarClanAncestor, RogueCat, RogueCatLeader.
;
; Keys:
;   Name = <any text>             the name shown for this cat
;   the cat's own data (the game's choices - saved by the game, so only use values the game has):
;     PrefixNameId = STR_CAT_NAME12  SuffixNameId = _HEART   (the game's name parts)
;     BodyValue, FaceValue, FurValue, EyeValue, WhiskerValue, TailIdx, EarIdx, FurIdx, FurColorIdx (0-24),
;     Pattern01ColorIdx, Pattern02ColorIdx, PatternIdx, MarkingIdx, EyeLeftColorIdx, EyeRightColorIdx, Gender,
;     CatSize, AccesoryHeadId / NeckId / PawId / BodyId (+ ...Var), ScarEyeId, ScarEarId, ScarBodyId, ScarChestId
;   extra looks on top (only what you see): Fur = #RRGGBB, Pattern, Markings, Tail.Fur, PatternMask = game:P13_Tabby,
;     MarkingsMask = game:M12_Mask, Look = Colourpoint ... (as in config/appearance.ini)

;[Narrative.ThunderClanDeputy]
;Name = Lionheart
;FurColorIdx = 1
;PatternIdx = 0
;Fur = #D9A441

;[ThunderClan.Leader]
