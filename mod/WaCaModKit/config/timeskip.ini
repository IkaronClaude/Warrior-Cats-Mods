; WaCa ModKit - intentional time skips (tickets.md 20) - EXPERIMENTAL, off by default
;
; Time passes on purpose and on screen: resting skips to a new morning, and the days you skip move the season, the
; weather and the prey on (weather.ini). Needs the day / night cycle (daynight.ini On = 1) - it counts the days.
;   RestKey: the key that makes your cat rest (empty = no key; other mods / day scripts can still skip).
;   RestDays: how many days one rest skips (1 = to the next morning; 7 = a quarter moon).
;   WakeHour: the hour the new day starts at (empty = daynight.ini StartHour).
;   Card: the text shown when time passes - {DAYS} ("A day", "A quarter moon", "A moon", "3 days"), {PASS} ("passes" /
;     "pass" to match), {SEASON},
;     {WEATHER}, {DAY} (the day number). CardSeconds: how long it shows.

[TimeSkip]
On = 0
RestKey = F9
RestDays = 1
WakeHour =
Card = {DAYS} {PASS}. It is {SEASON}.
CardSeconds = 6
