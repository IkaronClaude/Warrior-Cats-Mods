; WaCa ModKit - more graphics settings than the game's options screen
;
; Applied when the game starts and again after you close the game's own options. Leave a value empty for the game's.
;
; [Scalability] - the engine's quality groups: 0 = low, 1 = medium, 2 = high, 3 = epic, 4 = cinematic
; [CVars]       - any engine console variable, e.g. r.MotionBlurQuality = 0 (motion blur off),
;                 r.ScreenPercentage = 100 (render resolution in %), r.Tonemapper.Sharpen = 0.5, t.MaxFPS = 60,
;                 r.DepthOfFieldQuality = 0 (no depth of field), r.SceneColorFringeQuality = 0 (no chromatic aberration)

[Scalability]
ViewDistance =
AntiAliasing =
Shadows =
GlobalIllumination =
Reflections =
PostProcess =
Textures =
Effects =
Foliage =
Shading =
Landscape =

[CVars]
r.MotionBlurQuality =
r.ScreenPercentage =
r.DepthOfFieldQuality =
r.SceneColorFringeQuality =
t.MaxFPS =
