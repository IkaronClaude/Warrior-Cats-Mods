; WaCa ModKit - your cat's look
;
; Look: start from a preset in WaCaModKit/looks (e.g. Look = Colourpoint); everything below overrides it.
;
; Colours: any colour for each part of the coat, as #RRGGBB (e.g. #F8940B) or "r, g, b" (0-255). Empty = the game's.
;   Fur       the main coat              Pattern   the pattern's colour (tabby stripes, spots, ...)
;   Markings  the markings' colour       Paws (pads) / Ears (inside) / Nose / Whiskers
; One part only: Tail.Fur, Ears.Fur, Body.Fur, Tufts.Fur (the fur tufts) - or any part + any colour, e.g. Tail.Pattern.
;
; Masks: the SHAPE of the pattern or markings.
;   game:<name>   any of the game's own patterns (P01_Fishbone ... P23_Deluxe_Spotted) or markings (M01_Sock ...
;                 M20_Piebald) - e.g. MarkingsMask = game:M12_Mask - in either slot, so you can combine two markings
;   <folder>      a pattern pack of PNG masks in WaCaModKit/patterns (see the README there), or
;                 <Mod>/<path> for a pack inside another mod's folder
;
; Only what you see changes (your cat and the creation screen's preview); the save keeps the game's look.

