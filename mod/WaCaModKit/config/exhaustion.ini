; WaCa ModKit - exhaustion (tickets.md 4, Dredge-style) - EXPERIMENTAL, off by default
;
; Staying out late and doing too much tires your cat: it walks slower and is worse at hunting and fighting. Sleeping
; (a rest - the time-skip key, timeskip.ini) resets it. Needs the day / night cycle (daynight.ini On = 1).
;   PerHour: tiredness (0-100) per in-game hour awake; LateFactor: x that between LateHour and DawnHour.
;   PerDuty: tiredness per duty done (duties.ini).
;   [Tired] / [Exhausted]: At = from how tired; Speed / Hunt / Damage = walking speed, hunting chance and damage dealt
;   (x) while that tired (hunting / damage need hunting by chance on: hunting.ini [Chance] On = 1).

[Exhaustion]
On = 0
PerHour = 4
LateHour = 22
DawnHour = 5
LateFactor = 2.5
PerDuty = 5

[Tired]
At = 60
Speed = 0.85
Hunt = 0.85
Damage = 0.9

[Exhausted]
At = 85
Speed = 0.65
Hunt = 0.6
Damage = 0.75
