; WaCa ModKit - exhaustion (tickets.md 4) - EXPERIMENTAL, off by default
;
; A resource, not a meter to watch: it only goes down when your cat DOES something - a pounce on prey (caught or
; missed; needs hunting by chance: hunting.ini [Chance] On = 1) or a fight. Walking and exploring cost nothing. A
; tired cat is slower and worse at hunting and fighting - so one cat can only hunt so much in a day. Sleeping (a rest:
; the time-skip key, timeskip.ini) resets it.
;   PerPounce / PerFight: tiredness (0-100) per pounce / per fight.
;   LateHour / DawnHour / LateFactor: things done late (with the day / night cycle on) tire x LateFactor.
;   [Tired] / [Exhausted]: At = from how tired; Speed / Hunt / Damage = walking speed, hunting chance and damage dealt
;   (x) while that tired. Hunt = 0 at Exhausted = no more catches until your cat has slept.

[Exhaustion]
On = 0
PerPounce = 3
PerFight = 10
LateHour = 22
DawnHour = 5
LateFactor = 1.5

[Tired]
At = 60
Speed = 0.85
Hunt = 0.85
Damage = 0.9

[Exhausted]
At = 85
Speed = 0.65
Hunt = 0.6
Damage = 0.75
