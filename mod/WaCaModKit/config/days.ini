; WaCa ModKit - the story as days (tickets.md 25) - EXPERIMENTAL, off by default
;
; The story, as data: one [Day.N] per story day. A story day sets its scenes per phase, its duties, its season and
; weather, and when to move on. Until its Advance condition holds, the story day REPEATS (same setup, the scenes
; already seen skipped). Needs the day / night cycle (daynight.ini On = 1); duties need duties.ini On = 1, season /
; weather need weather.ini [Seasons] On = 1.
; With the clan loop on (duties.ini On = 1) a story day's BEATS play inside the loop: <Third> when your cat is back in
; camp after that third's task (before the clan's events), <Third>Start when the third begins (before the deputy).
; Without it they play at the [Days] hours.
;   [Days] MorningHour / AfternoonHour / EveningHour: when each phase's beats play (without the clan loop).
;   [Day.N]
;     Like = M: everything day M sets that this day doesn't (runs of similar days stay short); a key = none
;       turns one off for this day.
;     Morning / Noon / Evening / Night (+ Morning2, Morning3 ... for more steps; Noon also reads Afternoon) and
;       MorningStart / NoonStart / EveningStart / NightStart: scene steps - Card: <text> / Dialogue: <id> @ <who> (the
;       game's own conversations and cinematics: events-dialogues.txt) / Fade: <s> / FadeIn: <s> / Wait: <s> /
;       Bond: <n> @ <who> / Emit: <event> / Hook: <name> (see events.lua). Each plays once per story day.
;     Hunt / Patrol: the day's tasks (prey to catch / border points; empty = the clan's needs decide, 0 = none).
;     Gathering = Yes / No: today is (not) a Gathering day; GatheringPick = Chosen / NotChosen: the leader's pick
;       (gatherings.ini - else by the days and by chance).
;     MorningDuty / NoonDuty / EveningDuty / NightDuty: that third's task in the clan loop (duties.ini) - Hunt,
;       Patrol, Train, Free, NightWatch, Sleep; e.g. NightDuty = Hunt for a night hunt (empty = the clan's needs).
;     Season: the story day's season (a [Season.*] name of weather.ini; empty = by the day count).
;     Weather: the day's weather chances, e.g. Rain=70, Snow=10, Clear=20 (empty = the season's).
;     Advance: Always (default) | Duties (all the day's duties done) | Rank:<Name> (e.g. Rank:Warrior).

[Days]
On = 0
MorningHour = 7
AfternoonHour = 13
EveningHour = 19

; examples after the operator's (2026-10-25) - edit freely
[Day.1]
Season = Greenleaf
Weather = Clear=100
Hunt = 0
Patrol = 0
Morning = Card: Your first morning. The camp smells of fresh-kill and sun-warmed moss.
Evening = Card: The Clan gathers beneath the Highrock as the light fades.

[Day.2]
Like = 1
Morning = Card: Your mentor waits at the camp entrance.
Afternoon = Card: Your mentor shows you the borders of the territory.
Patrol = 2
Advance = Duties

[Day.10]
Season = Leaf-bare
Weather = Rain=70, Snow=10, Clear=20
Hunt = 2
Patrol = 1
Evening = Card: Tonight you keep your vigil, silent until dawn.

[Day.11]
Like = 10
Evening = none
