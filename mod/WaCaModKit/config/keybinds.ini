; WaCa ModKit - keyboard & mouse bindings
;
; Rebind any game command here. A command listed below REPLACES the game's keyboard/mouse keys for it (gamepad
; bindings are never touched). Commands you don't list keep the game's defaults. Save the file and the change
; applies the next time the game rebuilds its bindings (switching between keyboard and gamepad, or loading an area).
;
; [Actions]   Command = Key[, Key ...]
; [Axes]      Axis = Key:Scale[, Key:Scale ...]      (Scale 1 or -1 = direction)
;
; Key names are Unreal Engine key names: A..Z, One..Zero, F1..F12, Escape, Tab, SpaceBar, Enter, BackSpace,
; LeftShift, RightShift, LeftControl, RightControl, LeftAlt, Up, Down, Left, Right, LeftMouseButton,
; RightMouseButton, MiddleMouseButton, ThumbMouseButton, ThumbMouseButton2, MouseScrollUp, MouseScrollDown, ...
;
; The game's own keyboard defaults (for reference):
;   Player_Pause = P                Player_Show_Quest = K           Player_Show_Map = M
;   Player_Show_Inventory = I       Player_Interact = E             Player_Pounce = SpaceBar
;   Player_Run = LeftShift, RightShift                              Player_Crouch = LeftControl, RightControl
;   Player_Scent_Tracking = Q       Player_Camera_Reset = R         Player_Growl = L
;   Player_Play = J                 Player_Drop = C                 Player_Friend_Talk = C
;   Player_Den_Place = X            Player_ReturnToCamp = X
;   Minigame_Button_X = J   Minigame_Button_Y = L   Minigame_Button_A = I   Minigame_Button_B = K
;   Player_PhotoMode_Shoot = SpaceBar   Player_PhotoMode_Exit = X   Player_PhotoMode_HideUI = Q
;   Axes: Player_Movement_Up = W:1, S:-1          Player_Movement_Right = D:1, A:-1
;         Player_Camera_Up = Up:-1, Down:1        Player_Camera_Right = Right:1, Left:-1
;         Player_Customization_Yaw = Q:-1, E:1

[UIKeys]
; The menus' own keyboard keys (and the key icons they show): Row = Key. Rows are the game's menu buttons:
;   Button_A / Button_Confirm = Enter, Button_B / Button_Back = BackSpace (back / close), Button_X = E,
;   Button_Y = SpaceBar, Button_Select = V, Button_ShoulderL = One, Button_ShoulderR = Two, Button_TriggerL = Three,
;   Button_TriggerR = Four, Button_Inventory = O, Button_Teleport = H, Button_Randomize = R, Button_Skip = Enter
; A row set here REPLACES its key. A key may be on several rows and fires all of them (Enter is on Button_A,
; Button_Confirm and Button_Skip).

[UIIcons]
; Only the key icon a menu row shows (its key stays): Row = the key whose icon to show.
; back / close shows Esc
Button_B = Escape
Button_Back = Escape

[KeyAliases]
; Key = OtherKey[, ...]: in menus (paused or not), pressing Key also presses OtherKey, as a real key press.
; Escape also does what BackSpace does: back / close in every menu, BackSpace kept
Escape = BackSpace

[DialogueKeyAliases]
; Key = OtherKey[, ...]: while a conversation is on screen, pressing Key also presses OtherKey.
; Space advances / confirms dialogue like Enter
SpaceBar = Enter
; a left click advances it too (not while answer choices show - the click picks one)
LeftMouseButton = Enter

[Mouse]
; MenuCursor = 1: the mouse cursor shows in menus (the game hides it everywhere); 0 = the game's behaviour
MenuCursor = 1
; GameplayCapture: the mouse in gameplay - 1 = captured for mouse look (default), 3 = only while a button is held
; (drag to look, the game's own), 2 = captured from the first click, 0 = never
GameplayCapture = 1
; mouse look in gameplay: degrees the camera turns per mouse unit, left / right and up / down (raise for a faster
; camera; a negative number inverts that direction). The game's own camera "invert" settings apply too
LookYaw = 2.0
LookPitch = 1.5
; CameraRelativeMove = 1: right / left move your cat sideways, relative to the camera (only the mouse / camera keys
; turn the camera). 0 = the game's own: right / left turn the camera and the cat with it ("tank" controls)
CameraRelativeMove = 1

[Actions]
; pause on Escape instead of P
Player_Pause = Escape
; interact on a left click too (E kept)
Player_Interact = E, LeftMouseButton

[Axes]
; the camera (the gamepad's right stick) on the arrow keys. The mouse turns the gameplay camera directly ([Mouse]
; LookYaw / LookPitch), not through these axes. Photo mode's camera below still takes the mouse here: the number is
; its sensitivity, a flipped sign inverts that direction
Player_Camera_Right = Right:1, Left:-1
Player_Camera_Up = Up:-1, Down:1
Player_PhotoMode_Camera_Right = MouseX:0.3, Right:1, Left:-1
Player_PhotoMode_Camera_Up = MouseY:-0.3, Up:-1, Down:1
