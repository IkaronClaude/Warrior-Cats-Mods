; WaCa ModKit - clan activities (tickets.md 5) - EXPERIMENTAL, off by default
;
; ; [Join] On = 1: next to a story cat (the cats the game keeps bonds with - your mentor, the leader, the queen ...)
;           press Key and your cats spend time together (Montage, both of you); afterwards the bond grows by Bond
;           points, the game's own way (as a good dialogue answer does), at most PerDay times per cat and day.
;           Radius: how close (Unreal units).

[Join]
On = 0
Key = G
Radius = 400
Bond = 2
PerDay = 1
Montage = /Game/Art/Characters/CatMaster/Animations/Montages/AM_CatMaster_SimpleSit.AM_CatMaster_SimpleSit

[Ambient] On = 1: clanmates near your cat that are standing still now and then do something - sit, nap, sniff
;           around, play-fight - with the game's own animations.
;           Every: seconds between two activities (one cat each time). Radius: how near your cat (Unreal units; a cat
;           length is about 100). The scheduler only runs while you're in the world.
; [Activity.<Name>] Montage: the game's animation (object path). Weight: how often it's picked, relative to the others.
;           Pair = 1: two cats do it together: the nearest other idle clanmate within [Ambient] PairRadius walks over,
;           then both face each other and play.
;
; The VM check (2026-10-27): NPC cats play these while their own AI runs.

[Ambient]
On = 0
Every = 20
Radius = 3000
PairRadius = 2500

[Activity.Sit]
Montage = /Game/Art/Characters/CatMaster/Animations/Montages/AM_CatMaster_SimpleSit.AM_CatMaster_SimpleSit
Weight = 3

[Activity.Nap]
Montage = /Game/Art/Characters/CatMaster/Animations/Montages/AM_Interact_Sleep_1.AM_Interact_Sleep_1
Weight = 2

[Activity.Sniff]
Montage = /Game/Art/Characters/CatMaster/Animations/Montages/AM_Interact_Sniffing.AM_Interact_Sniffing
Weight = 2

[Activity.PlayFight]
Montage = /Game/Art/Characters/CatMaster/Animations/Combat/OffensiveStance/Montages/AM_SC_Wrestle.AM_SC_Wrestle
Weight = 1
Pair = 1
