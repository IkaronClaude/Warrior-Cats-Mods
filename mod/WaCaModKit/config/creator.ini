; WaCa ModKit - the character creator's extra choices (the WaCa panel on the customisation screen)
;
; Looks: the looks offered (files in WaCaModKit/looks, or <Mod>/<path>.ini in another mod). A look with "Row = Pattern"
;        or "Row = Markings" (e.g. Colourpoint) is offered as a shape in that row; any other one in a "Look" row.
; Packs: pattern packs (PNG mask folders in WaCaModKit/patterns, or <Mod>/<path>) offered as pattern / marking shapes,
;        next to all of the game's own patterns and markings.
; AutoLooks = 1: every enabled mod's looks/*.ini (a [Look] section) is offered too - a look mod is a folder you drop
;        into ue4ss/Mods, no edit here. 0 = only the Looks listed above.

; The WaCa panel (customisation screen, F5 / F6 / F7) only offers what the game's own grids can't: pattern packs and
;        whole-look presets. Pattern / markings looks are entries in the game's grids, so with neither configured
;        there is no panel. PanelShapes = 1: the panel also offers every game pattern / marking as a shape for either
;        row (a marking used as the pattern shape).

[Creator]
Looks = Colourpoint
AutoLooks = 1
PanelShapes = 0
Packs =
; NameBoxKeys: keys that move between the game's name list and the WaCa name box without confirming (keyboard and
;              gamepad key names; confirm on the list also moves into the box)
NameBoxKeys = Tab, Gamepad_LeftThumbstick
