; WaCa ModKit - the clan's own patrols (the clan loop, duties.ini) - EXPERIMENTAL, off by default
;
; When a third begins the deputy sends a patrol out by chance: Size cats from the camp walk out together to Points
; border points out in the territory, then back to camp. While it's out, the roles in Roles say their patrol lines
; (lines.ini [Dialogue.<Name>] Case = Patrol, Leader = LeaderRole for lines when that role leads).
;   Chance: % per third (in Thirds: Morning, Noon, Evening). Roles: filler roles (RiverClanApprentice ...).
;   GatherRadius: the clanmates are the nearest walking ones within this distance of the camp (cm) - they meet in camp
;   first (the camp's own cats are story cats the game doesn't walk).
; Other mods add to this file through their own content/patrols.ini (WaCa.ReadContent).

[Patrols]
On = 0
Chance = 50
Thirds = Morning, Evening
Size = 3
Points = 2
GatherRadius = 25000
Roles =
LeaderRole =
