; WaCa ModKit - your cat's specialisation (tickets.md 13: less "jack of all trades") - off by default
;
; Pick a role for your cat; it applies once your cat reaches MinRank (the game's ranks: Apprentice, Warrior, Deputy,
; Leader). Each role makes some things easier and others harder - multipliers on the mod's systems:
;   Hunt:  the hunting chance (hunting.ini [Chance], needs On = 1)
;   Fish:  the fishing bite chance (hunting.ini [Fishing])
;   Noise: how long prey still hears your cat after loud ground (smaller = quieter)
;   Combat: the damage your cat deals in the game's fights;  Guard: the damage it takes (0.85 = 15% less)
; Every key is optional (1 = no change). Add your own [Role.<Name>] sections.

[Specialisation]
Role =
MinRank = Warrior

; a born hunter: catches more, but heavy-pawed on the fishing rocks
[Role.Hunter]
Hunt = 1.15
Fish = 0.9
Combat = 0.95

; reads the ground and the water: quiet steps, patient at the river
[Role.Tracker]
Hunt = 1.0
Fish = 1.25
Noise = 0.5

; trained for battle, not the hunt: hits harder, takes less
[Role.Fighter]
Hunt = 0.85
Fish = 0.9
Combat = 1.25
Guard = 0.85
