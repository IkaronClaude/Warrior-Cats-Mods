; Wading: the game has no swimming - a cat that steps into water slows down, deeper water more.
; On: 1 = on, 0 = off.
; Shallow / Deep: the speed in shallow / deep water (1 = no change, 0.6 = 60 %).
; RiverClan: how much of that slow-down RiverClan cats get (0.5 = half, 0 = none - they move as on land).
[Wading]
On = 1
Shallow = 0.8
Deep = 0.6
RiverClan = 0.5
