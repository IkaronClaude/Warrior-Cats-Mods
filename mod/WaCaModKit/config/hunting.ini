; WaCa ModKit - hunting
;
; [Chance] Hunting by chance (EXPERIMENTAL): the game's prey instakill no longer always works. When your cat lands on
;          the prey, the hunt succeeds with: your rank's chance x the prey's factor - never above 100% minus
;          CriticalMiss (so even a deputy misses sometimes). A miss: the prey gets away (the game's own reaction).
;          PreyKinds: the kinds that are hunted by chance (game names; each covers its Weak* variant) - others (cats:
;          the sneak attack) keep the game's. Experience = 1: a catch gives the EXP a fight against that prey gives (the
;          game's combat EXP table). Noise = 1: a cat on loud ground (the game's own Loud areas - leaf litter, the
;          ground the game makes noisy) when it lands on the prey - or within NoiseWindow seconds of leaving it - is
;          heard: the prey gets away, no roll. On = 1 turns it on. RankIfUnknown: the rank used until the game reports your cat's (empty = no roll then). WaCaNative.log names every roll ("[hunt] landed on ...: chance 80%, rolled 42 -> CAUGHT").
; [RankChance] the chance per rank, in percent (over 100 is allowed - CriticalMiss still caps it). Rank names are the
;          game's: Apprentice, Warrior, Deputy, Leader.
; [PreyFactor] the chance factor per prey kind (game names: Mice, Squirrel, Rabbit, Bird, Rat, Fish ...); a kind also
;          covers its Weak* variant unless that is listed itself. Kinds not listed here: 1.0.
;
; [Prey] Flee = 1 (EXPERIMENTAL, off by default): POUNCE prey (the hunting kind) that notices your cat runs away
;        instead of reacting - pounce on it before it's gone. The prey that charge you in the open world are
;        different creatures (combat characters) - not covered yet (tickets.md 9).
;        FleeDistance: how far it runs (Unreal units; a cat length is about 100).
;        FleeSpeed: its running speed as a factor of its normal speed (1.0 = unchanged).
;        ExcludeTags: size tags (comma separated) that keep the game's reaction - the log names each prey's tag the
;        first time one flees ("[prey] a prey with size tag '...'" in WaCaNative.log).

[Chance]
On = 0
CriticalMiss = 5
RankIfUnknown =
PreyKinds = Mice, Squirrel, Rabbit, Bird, Fish
Experience = 1
Noise = 1
NoiseWindow = 3

[RankChance]
Apprentice = 20
Warrior = 80
Deputy = 130
Leader = 130

[PreyFactor]
Rabbit = 0.5

[Prey]
Flee = 0
FleeDistance = 2500
FleeSpeed = 1.0
ExcludeTags =
