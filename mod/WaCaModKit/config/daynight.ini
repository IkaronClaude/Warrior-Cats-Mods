; WaCa ModKit - day / night cycle (tickets.md 4) - EXPERIMENTAL, off by default
;
; The game has no cycle - its sky (BP_DayNightSky) only switches fixed looks. With On = 1 the sun moves across the sky,
; the light dims at night and the game's own night look blends in, over DayMinutes real minutes per full day.
;   StartHour: the hour a session starts at (0-24; 8 = morning).
;   SunHeight: the sun's highest angle at noon (degrees above the horizon).
;   NightLight: how much light is left at midnight (0.15 = 15% of the day's).
;   NightLook: how strongly the game's night look blends in at midnight (0-1).
;   UpdateSeconds: how often the sky is moved on (smaller = smoother).

[DayNight]
On = 0
DayMinutes = 24
StartHour = 8
SunHeight = 60
NightLight = 0.15
NightLook = 1.0
UpdateSeconds = 2
