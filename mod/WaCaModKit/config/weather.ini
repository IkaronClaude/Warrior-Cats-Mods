; WaCa ModKit - seasons and weather (tickets.md 21) - EXPERIMENTAL, off by default
;
; SEASONS follow the days of your save (the day / night cycle counts them: daynight.ini On = 1; without it the season
; stays StartSeason). Each season changes the light, the length of a day, and how well hunting / fishing go.
; WEATHER comes in spells: when one ends, the next is rolled from the season's chances and lasts MinHours-MaxHours
; in-game hours (without the day / night cycle: one roll per session). Weather dims / tints the light, thickens the fog
; and changes the hunting / fishing chances (rain washes scent out, fish bite better).
;
; [Seasons]
;   On: 1 = seasons and weather on.
;   Order: the seasons in order (names of the [Season.*] sections below).
;   StartSeason: the season of day 1.   DaysPerSeason: days before the next one.
;   PreyTurnover: the share of prey that come and go each in-game hour (0 = the season's roll stays all season).
; [Season.<Name>]   (every key optional)
;   DayMinutes / NightLight: override daynight.ini's for this season (shorter, darker days in leaf-bare).
;   Light: the light's strength (x).   Color: the sunlight's tint, R,G,B multipliers (1,1,1 = as is).
;   Hunt / Fish: hunting / fishing chance factors (x, on top of hunting.ini).
;   Weather: the chances of each weather (names of the [Weather.*] sections), weights.
;   Prey: the share of each prey kind that is about this season (the game's kinds: Mice, Squirrel, Rabbit, Bird,
;     Rat, ...; Weak* variants count as their kind; 1 = all of them, the default). The others are away: hidden,
;     back in a later season.
; [Weather.<Name>]  Light, Sky (the sky light), Fog (x density), Color, Hunt, Fish as above.
;   Effect: what falls around your cat - a material drawn on cylinders around it (the WaCa content pak's rain /
;     snow, WaCaModKit_P in Content\Paks\~mods) or a Niagara particle system. Empty = only the light / fog change.
;   EffectParams: tune a material Effect's look, e.g. EffectParams = Opacity=0.5, Width=0.1 - the WaCa rain / snow
;     material's: Columns / Rows (streaks around / up the cylinder), Speed, Length (of a streak), Width, Density
;     (share of cells with a drop), Sway, Opacity, Glow (light of its own), DepthFade, NearFade (cm).
;   Sound: a looping sound to play (a sound asset path).
; [Weather]
;   MinHours / MaxHours: how long a spell lasts (in-game hours).   FadeSeconds: how long a change of look takes.
;   Volume: the weather sound's volume (0-1).
;   EffectMesh / EffectLayers: the cylinder a material Effect is drawn on, and its copies around the cat
;     (radius x height, in cm: the inner one close, the outer ones for depth).

[Seasons]
On = 0
Order = Newleaf, Greenleaf, Leaf-fall, Leaf-bare
StartSeason = Greenleaf
DaysPerSeason = 7
PreyTurnover = 0.2

[Season.Newleaf]
DayMinutes = 24
Color = 0.97, 1.0, 0.95
Hunt = 1.0
Fish = 1.0
Weather = Clear=50, Overcast=25, Rain=25
Prey = Mice=0.9, Squirrel=0.8, Rabbit=0.9, Bird=1.0

[Season.Greenleaf]
DayMinutes = 28
NightLight = 0.2
Color = 1.0, 0.98, 0.92
Hunt = 1.1
Fish = 1.1
Weather = Clear=70, Overcast=15, Rain=15

[Season.Leaf-fall]
DayMinutes = 22
Color = 1.0, 0.9, 0.78
Hunt = 0.9
Fish = 1.0
Weather = Clear=35, Overcast=35, Rain=30
Prey = Mice=1.0, Squirrel=1.0, Rabbit=0.8, Bird=0.7

[Season.Leaf-bare]
DayMinutes = 18
NightLight = 0.1
Light = 0.85
Color = 0.88, 0.94, 1.0
Hunt = 0.6
Fish = 0.7
Weather = Clear=30, Overcast=40, Rain=10, Snow=20
Prey = Mice=0.6, Squirrel=0.2, Rabbit=0.5, Bird=0.4

[Weather]
MinHours = 3
MaxHours = 10
FadeSeconds = 20
Volume = 0.6
EffectMesh = /Game/Mods/WaCa/Weather/SM_WaCaPrecipCylinder.SM_WaCaPrecipCylinder
EffectLayers = 500x1200, 1100x1800, 2200x2600

[Weather.Clear]

[Weather.Overcast]
Light = 0.55
Sky = 0.8
Fog = 1.8
Color = 0.92, 0.95, 1.0

[Weather.Rain]
