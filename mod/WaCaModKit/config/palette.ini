; WaCa ModKit - extra colours for the character creator's palettes
;
; NOTE: the game's colour pickers are a FIXED grid (20 swatches; 25 with the DLC) - colours added here are appended to
; the palettes but do not show as swatches in the pickers. For your own colours use the hex box on the picker (top
; right): type #RRGGBB, Enter. These lists stay for mods that set a cat's colour index directly.
;
; Colours = #RRGGBB, ... : appended after the game's own colours of that palette.
; A cat with one of these keeps the exact colour in your save's WaCa ModKit file (next to the game's save); the
; game's save gets the nearest of its own colours, so it stays loadable without the mod.

