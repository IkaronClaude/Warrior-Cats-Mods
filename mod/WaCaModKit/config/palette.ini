; WaCa ModKit - extra colours in the character creator's colour pickers
;
; Colours = #RRGGBB, ... : added after the game's own 25 swatches of that picker.
; A cat picked with one of these keeps the exact colour in your save's WaCa ModKit file (next to the game's save);
; the game's save gets the nearest of its own colours, so it stays loadable without the mod.
; Changes here apply the next time the game starts.
;
; The LAST swatch of each picker is your own colour: choose it and a box appears on the picker - type #RRGGBB and
; press Enter. Custom = #RRGGBB sets the colour that swatch starts with (default white).

