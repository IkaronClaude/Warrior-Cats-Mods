; WaCa ModKit - scenes at given times (tickets.md 17 + 10: "show, don't tell") - EXPERIMENTAL, off by default
;
; Things happen on screen at a time of day, instead of being told about later. Needs the day / night cycle
; (daynight.ini On = 1) - it counts the hours and days. One section per scene:
;   [Event.<Name>]
;   Hour: the hour it happens (0-23).
;   Day: the day it happens (the save's day count, 1 = the first); with Every: the first day of a repeat.
;   Every: repeat every N days (no Day / Every = every day).
;   Once = 1: only once per save (remembered with the save).
;   Card: a text shown in the middle of the screen ({DAY} = the day number); CardSeconds: how long.
;   Dialogue: one of the game's own scripted conversations, with the clanmate nearest to your cat - the ids are
;     listed in events-dialogues.txt (written next to this file the first time you're in the world with this on).

[Events]
On = 0

; examples - edit or remove
[Event.Dawn]
Hour = 6
Card = Dawn breaks over the camp.

[Event.Gathering]
Day = 7
Every = 28
Hour = 20
Card = The full moon rises - the Gathering is tonight.
