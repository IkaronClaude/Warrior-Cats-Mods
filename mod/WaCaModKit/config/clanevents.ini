; WaCa ModKit - the clan's events (the clan loop, duties.ini) - what happens back in camp after a third's task
;
; One [Event.<Name>] per event:
;   When: Morning | Noon | Evening | Night - the third it belongs to (it plays when your cat is back in camp).
;   Chance: % (100 = every time).
;   Day / Every: from story day Day on (the day / night cycle's day count), every Every days; OnlyDay: that day only.
;   Once = 1: only once per save.
;   Step1, Step2 ...: the scene - Card: <text> / Dialogue: <id> @ <who> (the game's own conversations and cinematics:
;     events-dialogues.txt; <who>: Deputy, Leader, MedicineCat, Teacher, Nearest or a story role) / Fade: <s> /
;     FadeIn: <s> / Wait: <s> / Bond: <points> @ <who> / Emit: <event> (Lua: WaCa.On) / Hook: <name> (Lua:
;     Events.Hook(name, fn(ctx, continue)) - a mod's own cutscene goes here).
; Several events can come in one third (in name order). The story's beats for a day come first (days.ini).

[Event.ShareTongues]
When = Evening
Chance = 100
Step1 = Card: The clan gathers to eat. Your cat shares a piece of fresh-kill and tongues with its clanmates.
Step2 = Bond: 1 @ Nearest

[Event.ClanMeeting]
When = Morning
Chance = 15
Step1 = Card: The leader calls a clan meeting beneath the Highrock.

[Event.Gathering]
When = Evening
Day = 7
Every = 28
Step1 = Card: The full moon is up - tonight is the Gathering.
