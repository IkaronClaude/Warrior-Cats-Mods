; WaCa ModKit - Gatherings (the clan loop, duties.ini) - EXPERIMENTAL, off by default: the groundwork the story
; builds on. Every Every days the leader picks who goes to the Gathering.
;   [Gathering] FirstDay / Every: the Gathering days (the day / night cycle's day count) - a story day can say it
;     itself: days.ini Gathering = Yes / No, and GatheringPick = Chosen / NotChosen.
;   AnnounceThird: when the leader names the cats (the third's start); Third: when the Gathering is (back in camp).
;   The pick, without the story's word: never while BanVar > 0 (a punishment - "Add: GatheringBan 1" in any scene; each
;   Gathering missed takes one off) or below MinRank (empty = any rank); else by chance: Base % + PerStanding x your
;   standing in the clan + PerFavour x FavourVar (a story variable your scenes raise or lower - e.g. Add: LeaderFavour 3
;   for organising the camp's defence).
; Scenes (events.lua steps: Card / Dialogue @ who / Fade / FadeIn / Wait / Bond / Set / Add / If / Emit / Hook):
;   [Announce] then [Chosen] or [NotChosen]: the announcement. [Attend] or [StayBehind]: the Gathering's evening -
;   by default a Hook (GatheringAttend / GatheringStayBehind) for a mod's own scene.
; The outcome for the story: the variables Gathering.Chosen (1 / 0), Gathering.Count, Gathering.Today; the WaCa events
; GatheringAnnounced / GatheringHeld (day, chosen). E.g. a days.ini story day: Evening1 = If: Gathering.Chosen = 0,
; Evening2 = Card: Rogues! With half the clan away, ... - the story's beats come before the Gathering's scene.

[Gathering]
On = 0
FirstDay = 7
Every = 28
AnnounceThird = Morning
Third = Evening
MinRank = Apprentice
Base = 60
PerStanding = 2
FavourVar = LeaderFavour
PerFavour = 5
BanVar = GatheringBan

[Announce]
Step1 = Card: The full moon rises tonight. The leader names the cats who will go to the Gathering.

[Chosen]
Step1 = Card: Your cat is among them.

[NotChosen]
Step1 = Card: Your cat isn't chosen - it stays behind to guard the camp.

[Attend]
Step1 = Fade: 2
Step2 = Card: Under the full moon the four clans gather, and the truce holds.
Step3 = Hook: GatheringAttend
Step4 = FadeIn: 2

[StayBehind]
Step1 = Card: The camp is quiet with half the clan away at the Gathering.
Step2 = Hook: GatheringStayBehind
