; WaCa ModKit - the clan's day: duties (tickets.md 15) - EXPERIMENTAL, off by default
;
; Every morning your cat gets the day's duties from the clan's needs; at the day's end the duties done raise your
; standing in the clan and the ones skipped lower it (kept with your save). Needs the day / night cycle
; (daynight.ini On = 1) for the days. Cards in the middle of the screen say the duties, each one done, and the verdict.
;   [Duties] MaxRank: from this rank on your cat hands the duties out instead of getting them (Apprentice, Warrior,
;            Deputy, Leader).
;   [Hunt]   Min / Max: prey to catch (a random number in between - Max when the fresh-kill pile is under PileLow, of
;            100). Catches count with hunting by chance on (hunting.ini [Chance] On = 1).
;            HuntingGround = 1: a hunting ground with prey of the season is marked (sense mode shows the way).
;            PileReward: what a finished hunt adds to the clan's fresh-kill pile (of 100), the game's own way.
;   [Patrol] Points: border points to check; each is marked like StarClan's guidance (sense mode shows the way).
;            MinDistance / MaxDistance: how far they are (cm); Reach: how close counts as checked.
;   [Standing] Done / Missed: standing per duty done / missed.

[Duties]
On = 0
MaxRank = Deputy

[Hunt]
Min = 1
Max = 3
PileLow = 50
HuntingGround = 1
PileReward = 10

