; Colourpoint ("Ragdoll" / seal point): a pale coat with darker points - face, ears, tail. Uses the game's own "Mask"
; marking for the face and points, coloured like the points; the tail and ears are coloured as points too.
; Use it with Look = Colourpoint in config/appearance.ini; anything you set there overrides these values.
; Try other point colours: blue point #5A6472, chocolate #5E4231, lilac #8A7E86, flame #C2662D.

[Look]
Fur = #EFE6D6
Markings = #3E2B22
MarkingsMask = game:M12_Mask
Tail.Fur = #3E2B22
Ears.Fur = #3E2B22
