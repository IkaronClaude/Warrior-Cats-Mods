; Colourpoint ("Ragdoll" / seal point): darker points - face, ears, tail - on the coat.
; A pattern shape: pick "Colourpoint (WaCa)" as the creator's Pattern shape (F6) and choose the point colour with the
; game's own pattern colour picker (a pale fur colour looks most like a real colourpoint).
; In config/appearance.ini: PatternMask = look:Colourpoint. Values you set yourself there override these.
; Uses the game's "Mask" marking for the face and points; the tail and ears take the pattern colour as a whole.

[Look]
Row = Pattern
PatternMask = game:M12_Mask
Tail.Fur = Pattern
Ears.Fur = Pattern
