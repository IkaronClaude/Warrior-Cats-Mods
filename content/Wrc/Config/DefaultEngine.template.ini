; WaCa content project - the template of Config/DefaultEngine.ini. tools/build_content.ps1 writes DefaultEngine.ini
; from this plus the game's own [/Script/Engine.RendererSettings] (read from the player's game paks): materials must
; be compiled with the game's renderer settings (static lighting, virtual textures ...) or their shaders don't fit
; the game and crash the GPU device.
; The game's renderer targets (its DefaultEngine.ini): D3D12 SM5 + SM6, D3D11 SM5.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_Default
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False
